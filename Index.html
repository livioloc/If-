  <style>

    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 10% -12%,#38305f 0,transparent 40%),radial-gradient(ellipse at 100% 15%,#252c4b 0,transparent 37%),var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:4px}a{color:inherit} .shell{max-width:850px;margin:auto;padding:24px 20px 96px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:35px}.brand{font-weight:950;letter-spacing:-.07em;font-size:32px}.brand span{color:var(--coral)}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);border-radius:40px;padding:9px 14px;font-size:12px;font-weight:700;color:var(--muted);background:#ffffff07}.head-actions{display:flex;align-items:center;gap:8px}.tiny-btn{background:none;border:1px solid var(--border);color:var(--ink);border-radius:14px;padding:10px 13px;font-size:13px}.back{background:transparent;color:var(--muted);border:none;padding:9px 0;font-weight:700}.eyebrow{font-weight:850;letter-spacing:.18em;font-size:11px;color:var(--mint);text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(43px,9vw,77px);letter-spacing:-.066em;line-height:1.05;margin:17px 0 18px}h1 em{color:var(--coral);font-style:normal}h2{font-size:28px;letter-spacing:-.035em}h3{font-size:19px;letter-spacing:-.02em}p{line-height:1.65;color:var(--muted)}.hero{padding:10px 0 30px}.hero p{font-size:16px;max-width:550px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.sect-header{margin:30px 0 18px}.sect-header p{margin:6px 0;font-size:14px}.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.story-card{position:relative;text-align:left;min-height:292px;overflow:hidden;border-radius:25px;border:1px solid #ffffff1b;padding:22px;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s,border .2s;display:flex;flex-direction:column;align-items:flex-start;isolation:isolate}.story-card:hover{transform:translateY(-4px);border-color:#ffffff66}.story-card::before{content:"";position:absolute;width:200px;height:200px;border:1px solid #ffffff25;border-radius:50%;top:-95px;right:-65px;box-shadow:0 0 0 28px #ffffff06,0 0 0 57px #ffffff05;z-index:-1}.card-emoji{font-size:49px;margin:20px 0 24px;filter:drop-shadow(0 10px 15px #0004)}.card-top{font-size:11px;font-weight:850;letter-spacing:.12em;color:#fff9;text-transform:uppercase}.card-title{font-size:25px;font-weight:850;line-height:1.15;letter-spacing:-.04em;margin-bottom:8px}.card-desc{color:#f6f3ffba;font-size:13px;line-height:1.45;margin-bottom:15px}.card-foot{display:flex;justify-content:space-between;width:100%;font-size:12px;color:#fff9;margin-top:auto;padding-top:12px;border-top:1px solid #ffffff2b}.btn{border:0;border-radius:16px;min-height:51px;background:var(--coral);color:#222032;padding:13px 20px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:10px}.btn.secondary{background:#ffffff12;color:var(--ink);border:1px solid var(--border)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.wide{width:100%}.mini-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:25px 0;background:linear-gradient(100deg,#30284d,#222544);border:1px solid #a69aff36;border-radius:22px;padding:18px 20px}.mini-banner strong{display:block;margin-bottom:4px}.mini-banner p{margin:0;font-size:13px}.mini-banner .btn{white-space:nowrap}.screen-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 22px}.chapter{font-size:12px;font-weight:750;color:var(--mint);letter-spacing:.1em;text-transform:uppercase}.progress-track{height:6px;border-radius:100px;background:#ffffff19;overflow:hidden;margin:15px 0 22px}.progress-bar{height:100%;background:linear-gradient(90deg,var(--coral),var(--lilac));border-radius:inherit;transition:width .3s}.scene-card{border:1px solid var(--border);background:linear-gradient(150deg,#22223c,#19192e);border-radius:25px;padding:clamp(22px,5vw,35px);box-shadow:var(--shadow)}.scene-symbol{width:72px;height:72px;display:grid;place-items:center;background:#ffffff0d;border:1px solid #ffffff20;border-radius:21px;font-size:35px;margin-bottom:21px}.scene-card h2{font-size:clamp(27px,6vw,39px);line-height:1.12}.scene-narration{color:#e6e3f3;font-size:17px;line-height:1.78;white-space:pre-line;margin-bottom:0}.scene-kicker{color:var(--mint);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;margin:0 0 12px}.prompt{font-size:19px;letter-spacing:-.015em;font-weight:800;margin:28px 0 15px}.choices{display:grid;gap:11px}.choice{border:1px solid var(--border);background:#ffffff0a;border-radius:18px;color:var(--ink);padding:18px 17px;text-align:left;display:flex;align-items:center;gap:14px;min-height:68px;transition:background .17s,border .17s}.choice:hover{background:#ffffff18;border-color:var(--lilac)}.choice-index{display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;width:33px;height:33px;flex-shrink:0;font-size:13px;color:var(--mint);font-weight:750}.choice-label{line-height:1.45;flex:1;font-weight:700}.arrow{font-size:21px;color:var(--lilac)}.stats{margin:0 0 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:11px 12px;background:#ffffff08;border:1px solid #ffffff11;border-radius:14px}.stat-name{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.stat-meter{height:5px;border-radius:100px;background:#ffffff1a;overflow:hidden}.stat-meter>span{display:block;height:100%;background:var(--mint);transition:width .2s}.stat:nth-child(2) .stat-meter>span{background:var(--lilac)}.stat:nth-child(3) .stat-meter>span{background:var(--coral)}.impact-tag{display:inline-block;padding:8px 12px;border-radius:40px;color:var(--mint);background:#8de6d118;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:850;margin-bottom:22px}.impact-choice{font-size:14px;font-weight:700;color:var(--lilac);margin-bottom:16px}.impact-title{font-size:40px;font-weight:850;letter-spacing:-.05em;line-height:1.1}.impact-description{font-size:18px;color:#eeeaf9;white-space:pre-line}.impact-summary{display:flex;gap:9px;flex-wrap:wrap;margin:19px 0 27px}.delta{border:1px solid #ffffff25;border-radius:40px;padding:8px 12px;font-size:12px;font-weight:700}.delta.plus{color:var(--mint)}.delta.minus{color:#ffc7ae}.outcome-icon{font-size:67px;margin:14px 0}.outcome-title{font-size:clamp(35px,8vw,58px);letter-spacing:-.06em;line-height:1.05}.outcome-text{font-size:18px;color:#e8e5f5;white-space:pre-line}.outcome-sub{font-size:14px;color:var(--muted)}.journal{margin-top:30px}.journal-entry{padding:16px 0;border-bottom:1px solid var(--border)}.journal-entry strong{display:block;font-size:14px}.journal-entry p{font-size:13px;margin:6px 0 0}.empty{padding:38px 25px;background:#ffffff08;border:1px solid var(--border);border-radius:20px;text-align:center}.history-card{padding:18px;border:1px solid var(--border);border-radius:18px;background:#ffffff08;margin-bottom:12px}.history-card .meta{font-size:12px;color:var(--muted)}.footnote{padding:40px 10px 0;text-align:center;font-size:12px;color:#9694b5}.muted{color:var(--muted)}.results-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.results-actions .btn{flex:1}.notice{background:#ffffff0a;border:1px solid var(--border);border-radius:15px;padding:13px 16px;color:var(--muted);font-size:13px;margin:20px 0}.numbers{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.number{background:#ffffff08;border:1px solid #ffffff10;border-radius:15px;padding:13px 18px}.number strong{display:block;color:var(--ink);font-size:24px}.number span{font-size:12px;color:var(--muted)}.danger{color:#ffc5bc}.small{font-size:12px}.hidden{display:none!important}
    @media(max-width:520px){.shell{padding:20px 16px 80px}header{margin-bottom:18px}.brand{font-size:29px}.pill{padding:8px 10px;font-size:11px}h1{font-size:51px}.stories{grid-template-columns:1fr}.story-card{min-height:235px}.card-emoji{margin:14px 0 12px}.scene-narration{font-size:16px}.mini-banner{align-items:flex-start;flex-direction:column}.mini-banner .btn{width:100%}.results-actions{flex-direction:column}.scene-card{padding:23px 20px}.stat{padding:11px 8px}.stat-name{font-size:10px}.screen-top{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  <script>
  'use strict';
  const STORIES = [
    {
      id:'2317',title:'23 h 17',genre:'Mystère / suspense',icon:'🚉',gradient:'linear-gradient(145deg,#614d81,#312c54 65%,#201d3b)',desc:'Un SMS arrive… depuis ton propre numéro. Il semble connaître ton avenir.',minutes:'4 min',steps:5,
      nodes:{
        start:{title:'Un message impossible',scene:'Quai n° 4 · 23 h 17',text:'Tu attends le dernier train. Ton téléphone vibre.\n\nExpéditeur : toi-même.\n\n« NE MONTE PAS DANS LE TRAIN. Dans quatre minutes, tout bascule. »\n\nAu bout du quai, une femme en manteau jaune te fixe sans bouger.',choices:[{label:'Monter dans le train pour comprendre.',to:'wagon',effect:[2,0,-1],result:'Les portes se referment derrière toi. Ton téléphone affiche désormais 23 h 18.',tag:'train'},{label:'Rester sur le quai et observer.',to:'quai',effect:[0,0,2],result:'Tu recules d’un pas. La femme en jaune se dirige brusquement vers les escaliers.',tag:'quai'},{label:'Avertir la femme en manteau jaune.',to:'quai',effect:[0,2,0],result:'Elle pâlit : « Tu as reçu le message, toi aussi ? »',tag:'femme'}]},
        wagon:{title:'Le siège vide',scene:'À bord · 23 h 18',text:'Le train démarre… puis ralentit étrangement. Sur la banquette face à toi : une enveloppe avec ton prénom.\n\nUn agent passe en murmurant : « Ne faites confiance à aucune horloge. »',choices:[{label:'Ouvrir l’enveloppe.',to:'preuve',effect:[0,0,2],result:'Une photo montre le quai, mais elle est datée de demain.',tag:'photo'},{label:'Suivre discrètement l’agent.',to:'signal',effect:[2,0,0],result:'Tu le suis jusqu’à une porte marquée « Commande ».',tag:'agent'}]},
        quai:{title:'Un départ qui n’en est pas un',scene:'Le quai · 23 h 18',text:'Le train reste à l’arrêt, moteurs allumés. La grande horloge revient subitement à 23 h 17.\n\nLa femme en jaune a laissé tomber un badge d’accès à la salle de contrôle.',choices:[{label:'Récupérer le badge et vérifier les écrans.',to:'preuve',effect:[0,0,2],result:'Les caméras montrent le quai… sept minutes dans le futur.',tag:'camera'},{label:'Courir après la femme en jaune.',to:'signal',effect:[2,1,0],result:'Elle se retourne : « Si tu veux sortir de la boucle, viens ! »',tag:'femme'}]},
        preuve:{title:'Le détail qui change tout',scene:'Salle de contrôle · 23 h 19',text:'Sur les écrans, tu vois les mêmes voyageurs répéter les mêmes gestes. Pourtant, sur un écran, une personne réagit différemment : toi.\n\nUne alarme signale une synchronisation imminente.',choices:[{label:'Comparer les images pour trouver la cause.',to:'antenne',effect:[0,0,2],result:'Tu identifies une antenne expérimentale reliée à l’horloge centrale.',tag:'preuve'},{label:'Prévenir les voyageurs avant la synchronisation.',to:'alarme',effect:[0,2,0],result:'Quelques voyageurs t’écoutent. Les autres rient… jusqu’à ce que les écrans se figent.',tag:'entraide'}]},
        signal:{title:'Une voix dans l’interphone',scene:'Accès technique · 23 h 19',text:'Une voix sort de l’interphone : « À chaque tentative, la station revient au même instant. Quelqu’un doit arrêter le signal. »\n\nÀ côté, un boîtier clignote : RISQUE DE RESET.',choices:[{label:'Ouvrir le boîtier et chercher l’alimentation.',to:'antenne',effect:[2,0,1],result:'Tu trouves un plan du dispositif. Il reste moins d’une minute.',tag:'plan'},{label:'Diffuser une annonce aux voyageurs.',to:'alarme',effect:[0,2,0],result:'Tu demandes de s’éloigner des quais. Plusieurs personnes t’aident.',tag:'entraide'}]},
        antenne:{title:'La minute décisive',scene:'Local technique · 23 h 20',text:'L’antenne pulse à intervalle fixe. Deux câbles principaux sont accessibles.\n\nTu n’as aucune certitude sur ce qu’une coupure pourrait provoquer.',choices:[{label:'Lire les consignes avant d’intervenir.',to:'finale',effect:[0,0,2],result:'Les consignes révèlent un interrupteur d’arrêt d’urgence, caché derrière un capot.',tag:'protocole'},{label:'Tenter une coupure immédiate.',to:'finale',effect:[2,0,-1],result:'Le signal s’interrompt une seconde, puis une vibration secoue la pièce.',tag:'coupure'}]},
        alarme:{title:'La foule retient son souffle',scene:'Hall central · 23 h 20',text:'Les voyageurs commencent à comprendre : les annonces se répètent exactement.\n\nUn enfant te demande : « Est-ce qu’on peut sortir ? » La grande horloge clignote.',choices:[{label:'Organiser une évacuation calme.',to:'finale',effect:[0,2,1],result:'Un couloir se libère. La foule rejoint les escaliers sans cohue.',tag:'evacuation'},{label:'Aller seul vers la salle technique.',to:'finale',effect:[2,0,0],result:'Tu atteins la porte technique au moment où l’horloge s’éteint.',tag:'solo'}]},
        finale:{title:'23 h 21',scene:'Dernières secondes',text:'Le grondement du train disparaît. L’horloge affiche 23 h 21 pour la première fois.\n\nTout autour de toi semble attendre un dernier geste. Cette fois, personne ne peut choisir à ta place.',choices:[{label:'Agir après avoir vérifié ce qui peut l’être.',to:'END',effect:[0,0,2],result:'Tu prends la décision en connaissance de cause. Le temps repart.',tag:'final_prudent'},{label:'Faire confiance à ton instinct et agir.',to:'END',effect:[2,0,-1],result:'Tu te lances. Pendant une seconde, le monde devient silencieux.',tag:'final_instinct'},{label:'Faire participer les autres à la décision.',to:'END',effect:[0,2,0],result:'Plusieurs mains t’aident. La décision devient collective.',tag:'final_groupe'}]}
      },
      endings:[
        {id:'brisee',title:'La boucle brisée',icon:'🌅',text:'L’horloge repart. Les portes s’ouvrent sur une gare ordinaire, lumineuse et bruyante.\n\nTes observations et tes choix ont permis de comprendre le mécanisme au lieu de réagir à l’aveugle. Quelques voyageurs se souviennent. Pas tous.\n\nTon téléphone affiche un dernier SMS : « Cette fois, c’est différent. »',sub:'Tu as privilégié la lucidité pour reprendre la main.'},
        {id:'ensemble',title:'Les témoins de 23 h 17',icon:'🤝',text:'Le temps reprend sa course. Tu n’as pas résolu toutes les énigmes, mais tu as aidé plusieurs personnes à traverser l’incident ensemble.\n\nAu pied des escaliers, la femme en jaune te sourit : « On ne sort pas toujours d’une boucle seul. »',sub:'Tu as construit une issue collective.'},
        {id:'inconnue',title:'Une autre version de toi',icon:'🌀',text:'Une lumière traverse le quai. Le train repart et les panneaux cessent de clignoter. Tu es dehors, sain et sauf.\n\nMais dans ta poche, une photo que tu n’as pas prise. Elle te montre sur le quai… demain.\n\nL’histoire n’est peut-être pas terminée.',sub:'Tu as choisi l’action, quitte à garder une part de mystère.'}
      ],resolve:s=>s.stats[2]>=8?'brisee':s.stats[1]>=8?'ensemble':'inconnue'
    },
    {
      id:'panne',title:'48 heures sans réseau',genre:'Survie / quotidien',icon:'🔦',gradient:'linear-gradient(150deg,#276e72,#254a64 60%,#1b344b)',desc:'Plus d’électricité, plus de réseau. Le quartier compte sur ses habitants.',minutes:'4 min',steps:5,
      nodes:{
        start:{title:'Tout s’éteint',scene:'Un samedi · 19 h 42',text:'Le quartier plonge dans le noir. Les téléphones perdent le réseau. Le courant ne revient pas.\n\nTu entends quelqu’un frapper à la porte : une voisine âgée explique que son téléphone médical ne fonctionne plus.',choices:[{label:'Vérifier d’abord si elle est en sécurité et a besoin d’aide.',to:'voisins',effect:[0,2,1],result:'Elle te rassure sur son état, mais te demande de contacter son proche.',tag:'aide'},{label:'Faire un rapide inventaire des ressources disponibles.',to:'stocks',effect:[0,0,2],result:'Tu rassembles eau, lampes et radio à piles.',tag:'inventaire'},{label:'Sortir immédiatement constater l’étendue de la panne.',to:'voisins',effect:[2,0,0],result:'Toute la rue est noire et les voisins sont déjà dehors.',tag:'dehors'}]},
        voisins:{title:'Le quartier se rassemble',scene:'Dans la rue · 20 h 05',text:'Une dizaine de voisins se retrouvent devant les maisons. Personne ne sait quand le courant reviendra.\n\nUn parent s’inquiète pour le lait de son nourrisson. Un autre cherche une lampe.',choices:[{label:'Organiser une mise en commun des besoins et ressources.',to:'centre',effect:[0,2,1],result:'Un tableau papier est installé dans l’entrée d’un immeuble.',tag:'collectif'},{label:'Chercher des informations fiables à la radio.',to:'information',effect:[0,0,2],result:'Une station locale confirme une panne étendue.',tag:'radio'}]},
        stocks:{title:'Des ressources limitées',scene:'À la maison · 20 h 05',text:'Tu trouves de l’eau, deux lampes, quelques conserves et une radio.\n\nUn voisin demande de l’aide : des personnes restent bloquées dans une résidence sans éclairage.',choices:[{label:'Partager les lampes et rejoindre les voisins.',to:'centre',effect:[0,2,0],result:'Les déplacements les plus urgents deviennent plus sûrs.',tag:'partage'},{label:'Écouter la radio avant d’organiser la suite.',to:'information',effect:[0,0,2],result:'Les consignes diffusées permettent d’éviter plusieurs erreurs.',tag:'radio'}]},
        centre:{title:'Une solidarité fragile',scene:'Point de rencontre · 21 h 30',text:'Le groupe s’organise. Mais un voisin insiste pour faire tourner un groupe électrogène dans son garage fermé.\n\nPlusieurs personnes trouvent l’idée rassurante.',choices:[{label:'Expliquer le danger du monoxyde de carbone et demander une installation extérieure sûre.',to:'nuit',effect:[0,1,2],result:'Le groupe renonce à utiliser le groupe électrogène dans le garage.',tag:'securite'},{label:'Proposer plutôt une organisation sans générateur pour la nuit.',to:'rue',effect:[0,2,1],result:'Vous définissez des tournées et un lieu de rassemblement.',tag:'organisation'}]},
        information:{title:'La rumeur',scene:'Fréquence locale · 21 h 30',text:'La radio conseille de limiter les déplacements et de préserver l’eau.\n\nDans le quartier, une rumeur annonce que l’alimentation ne reviendra jamais. La tension monte.',choices:[{label:'Partager uniquement les informations vérifiées.',to:'nuit',effect:[0,0,2],result:'Les discussions s’apaisent quand les faits sont distingués des hypothèses.',tag:'infofiable'},{label:'Réunir les voisins pour répartir les priorités.',to:'rue',effect:[0,2,1],result:'Un plan simple est établi pour la nuit.',tag:'organisation'}]},
        nuit:{title:'Une nuit très longue',scene:'03 h 10',text:'La température baisse. Une famille n’a plus de lumière. La batterie de ton téléphone est presque vide.\n\nTu dois choisir comment utiliser l’énergie restante.',choices:[{label:'Garder une réserve pour un appel indispensable et aider à se regrouper.',to:'matin',effect:[0,1,2],result:'Vous préservez la batterie et réduisez les déplacements isolés.',tag:'reserve'},{label:'Utiliser la dernière batterie pour tenter de joindre les proches.',to:'matin',effect:[1,1,-1],result:'Un message part avant que l’écran s’éteigne.',tag:'appel'}]},
        rue:{title:'Une décision collective',scene:'03 h 10',text:'La rue est calme mais des habitants commencent à s’épuiser. Les volontaires doivent se relayer.\n\nUne personne suggère de partir explorer la ville de nuit.',choices:[{label:'Maintenir un point de rencontre sûr et des relais de repos.',to:'matin',effect:[0,2,1],result:'Tout le monde connaît le lieu de rendez-vous et les prochaines étapes.',tag:'repos'},{label:'Partir chercher des informations, en annonçant ton trajet.',to:'matin',effect:[2,0,0],result:'Tu identifies quelques rues alimentées, sans savoir si l’information tiendra.',tag:'exploration'}]},
        matin:{title:'Le deuxième matin',scene:'08 h 20',text:'Une annonce radio promet un retour progressif du courant.\n\nLe quartier a tenu bon, mais certains habitants auront encore besoin d’aide après la panne.',choices:[{label:'Mettre en place une vérification des besoins prioritaires.',to:'END',effect:[0,2,1],result:'Vous répartissez les dernières tâches sans oublier les plus fragiles.',tag:'suite_collective'},{label:'Faire un bilan pratique et préparer les prochaines pannes.',to:'END',effect:[0,0,2],result:'Vous notez les équipements manquants et les bonnes décisions.',tag:'suite_plan'},{label:'Profiter du retour à la normale pour agir rapidement.',to:'END',effect:[2,0,0],result:'Tu aides aux urgences matérielles les plus visibles.',tag:'suite_action'}]}
      },
      endings:[
        {id:'collectif',title:'Le quartier se relève ensemble',icon:'🏘️',text:'Le courant revient par intermittence. Le point de rencontre reste ouvert pour les voisins encore en difficulté.\n\nVous avez transformé un moment de panique en entraide concrète. Une liste de contacts papier est désormais affichée pour la prochaine fois.',sub:'Tu as privilégié les personnes et la coordination.'},
        {id:'organise',title:'Prêts pour la prochaine fois',icon:'📻',text:'Le réseau revient enfin. Votre quartier a tenu grâce à quelques décisions méthodiques : informations fiables, sécurité et organisation.\n\nEn quelques jours, les voisins fabriquent un petit plan de préparation commun.',sub:'Ton sang-froid a créé des solutions durables.'},
        {id:'action',title:'L’énergie des premières heures',icon:'⚡',text:'L’électricité revient. Tu as été parmi les premiers à agir et à te déplacer pour comprendre la situation.\n\nTout n’a pas été parfaitement organisé, mais ton initiative a permis de débloquer plusieurs difficultés.',sub:'Tu as choisi l’action immédiate.'}
      ],resolve:s=>{const last=s.log.at(-1)?.tag;if(last==='suite_action'||s.stats[0]>=9)return 'action';if(last==='suite_plan'||(s.stats[2]>=9&&s.stats[1]<8))return 'organise';return 'collectif'}
    },
    {
      id:'demain',title:'Une journée d’avance',genre:'Science-fiction / dilemme',icon:'⌛',gradient:'linear-gradient(145deg,#86515f,#5b3d65 60%,#372e55)',desc:'Chaque matin, une application t’annonce les événements du lendemain. Jusqu’à aujourd’hui.',minutes:'5 min',steps:5,
      nodes:{
        start:{title:'Une notification de demain',scene:'Mardi · 07 h 06',text:'Une application inconnue apparaît sur ton téléphone.\n\n« Bonjour. Voici trois événements qui se produiront demain. »\n\nLes deux premiers sont anodins. Le troisième annonce qu’un ami risque de perdre son travail. Le message est étrangement précis.',choices:[{label:'Prévenir immédiatement cet ami.',to:'ami',effect:[0,2,0],result:'Ton ami te croit à moitié, mais promet de rester vigilant.',tag:'averti'},{label:'Vérifier si les prédictions sont fiables.',to:'preuve',effect:[0,0,2],result:'Le premier événement se produit à la minute indiquée.',tag:'verification'},{label:'Essayer de désactiver l’application.',to:'preuve',effect:[1,0,1],result:'Impossible de la supprimer. Un nouveau message apparaît : « Tu as déjà commencé. »',tag:'desactive'}]},
        ami:{title:'L’effet papillon',scene:'Mardi · 12 h 40',text:'Ton ami agit différemment grâce à ton avertissement. L’application se met à jour :\n\n« Prévision modifiée. Une autre personne subira les conséquences. »',choices:[{label:'Chercher une solution qui protège les deux personnes.',to:'alternatives',effect:[0,2,1],result:'Tu contactes discrètement les personnes concernées.',tag:'tous'},{label:'Demander à l’application davantage de détails.',to:'algorithme',effect:[0,0,2],result:'Une liste de probabilités apparaît, sans explication sur leur origine.',tag:'details'}]},
        preuve:{title:'Une machine qui sait',scene:'Mardi · 12 h 40',text:'Un événement annoncé se réalise exactement.\n\nPuis un nouvel écran s’ouvre : « Tu peux prévenir une personne, mais ta décision modifiera toutes les prévisions suivantes. »',choices:[{label:'Prévenir la personne menacée malgré l’incertitude.',to:'alternatives',effect:[0,2,0],result:'La prévision change immédiatement. Ton geste a eu un effet.',tag:'prevenir'},{label:'Examiner la façon dont l’application calcule.',to:'algorithme',effect:[0,0,2],result:'Tu remarques que ses prédictions se basent aussi sur tes comportements.',tag:'modele'}]},
        alternatives:{title:'Les conséquences cachées',scene:'Mardi · 17 h 55',text:'Deux scénarios apparaissent sur l’écran. Dans les deux cas, quelqu’un est pénalisé.\n\nPour la première fois, l’application te demande : « Quel résultat souhaites-tu privilégier ? »',choices:[{label:'Refuser de choisir à la place des autres.',to:'confiance',effect:[0,2,1],result:'L’application affiche : « Variable humaine non calculable ».',tag:'autonomie'},{label:'Chercher une troisième possibilité.',to:'faille',effect:[2,0,1],result:'Tu trouves une action simple que les deux scénarios avaient négligée.',tag:'troisieme'}]},
        algorithme:{title:'L’erreur invisible',scene:'Mardi · 17 h 55',text:'Un écran technique révèle quelque chose : la machine ne voit pas l’avenir. Elle calcule des comportements extrêmement probables.\n\nPlus elle influence les gens, plus ses prévisions deviennent exactes.',choices:[{label:'Expliquer cette découverte à ceux qui utilisent l’application.',to:'confiance',effect:[0,2,1],result:'Plusieurs personnes commencent à remettre en question les prédictions.',tag:'explication'},{label:'Chercher comment perturber volontairement les calculs.',to:'faille',effect:[2,0,1],result:'Tu découvres une faiblesse : elle ignore les choix concertés.',tag:'faille'}]},
        confiance:{title:'La décision appartient à qui ?',scene:'Mercredi · 06 h 50',text:'L’application affiche un ultime message : « Je peux rendre vos décisions plus prévisibles. Laissez-moi décider pour vous. »\n\nAutour de toi, chacun hésite entre sécurité et liberté.',choices:[{label:'Proposer de décider ensemble, même sans garantie.',to:'ultime',effect:[0,2,0],result:'Un groupe accepte de partager les risques et de choisir librement.',tag:'ensemble'},{label:'Demander des explications transparentes avant toute décision.',to:'ultime',effect:[0,0,2],result:'Les limites de l’algorithme apparaissent à l’écran.',tag:'transparence'}]},
        faille:{title:'Le paradoxe',scene:'Mercredi · 06 h 50',text:'Tu as compris : une décision réellement inattendue peut casser le modèle.\n\nMais surprendre l’algorithme n’est pas forcément une bonne raison pour faire un choix.',choices:[{label:'Choisir selon tes valeurs, pas pour déjouer la machine.',to:'ultime',effect:[0,1,2],result:'L’application ne parvient plus à formuler une recommandation unique.',tag:'valeurs'},{label:'Tester une action collective imprévisible.',to:'ultime',effect:[2,1,0],result:'Plusieurs futurs possibles apparaissent simultanément.',tag:'action_collective'}]},
        ultime:{title:'Demain ne sera pas écrit',scene:'Mercredi · 07 h 06',text:'Le téléphone vibre une dernière fois.\n\n« Dernière question. Préfères-tu un futur garanti ou la liberté de le créer ? »\n\nLe compteur de réponse arrive à zéro.',choices:[{label:'Partager ce que tu sais et laisser chacun décider.',to:'END',effect:[0,2,0],result:'Les notifications cessent. Les conversations, elles, commencent.',tag:'liberte'},{label:'Rendre les prédictions explicables avant de les utiliser.',to:'END',effect:[0,0,2],result:'L’application devient un outil de réflexion, plus un oracle.',tag:'outil'},{label:'Éteindre le téléphone et accepter l’inconnu.',to:'END',effect:[2,0,0],result:'Pour la première fois, tu ne connais aucune prévision. Et tu souris.',tag:'inconnu'}]}
      },
      endings:[
        {id:'liberte',title:'Le futur appartient à tous',icon:'🫶',text:'Les gens cessent de suivre aveuglément les prédictions. Certains continuent d’utiliser les données, mais personne ne leur abandonne ses choix.\n\nTon ami te remercie : « Tu ne m’as pas dit quoi faire. Tu m’as aidé à décider. »',sub:'Tu as défendu la confiance et la liberté de choisir.'},
        {id:'outil',title:'Le miroir des possibles',icon:'🔭',text:'L’application perd son aura magique. Les prédictions deviennent des hypothèses, avec leurs limites et leurs erreurs.\n\nTu découvres qu’un bon outil n’annonce pas ton destin. Il t’aide à voir les chemins possibles.',sub:'Tu as privilégié la compréhension plutôt que la certitude.'},
        {id:'inconnu',title:'La beauté de l’incertain',icon:'🌠',text:'La dernière prédiction s’efface. Demain n’est plus une ligne écrite à l’avance.\n\nTu te lèves, tu ouvres la porte et tu fais un choix qui n’apparaissait sur aucun écran.',sub:'Tu as préféré l’audace à un avenir tout tracé.'}
      ],resolve:s=>{const last=s.log.at(-1)?.tag;if(last==='inconnu'||s.stats[0]>=9)return 'inconnu';if(last==='outil'||(s.stats[2]>=9&&s.stats[1]<8))return 'outil';return 'liberte'}
    }
  ];
  const KEY='et-si-v1';
  const initial=()=>({active:null,position:'home',node:null,step:0,stats:[5,5,5],log:[],impact:null,history:[]});
  function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d && Array.isArray(d.stats)&&Array.isArray(d.history))return {...initial(),...d};}catch(e){}return initial()}
  let state=load();
  const el=document.getElementById('app');
  const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const story=()=>STORIES.find(s=>s.id===state.active);
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  const labels=['Audace','Empathie','Lucidité'];
  const statsHTML=()=>`<div class="stats" aria-label="Indicateurs de ton parcours">${labels.map((name,i)=>`<div class="stat"><span class="stat-name">${name} · ${state.stats[i]}/10</span><div class="stat-meter"><span style="width:${state.stats[i]*10}%"></span></div></div>`).join('')}</div>`;
  function render(){
    document.getElementById('historyButton').textContent=state.position==='history'?'↩ Retour':'☰ Journal';
    if(state.position==='home')return renderHome();
    if(state.position==='history')return renderHistory();
    const s=story();if(!s){state.position='home';save();return renderHome()}
    if(state.position==='scene')return renderScene(s);
    if(state.position==='impact')return renderImpact(s);
    if(state.position==='ending')return renderEnding(s);
    state.position='home';renderHome();
  }
  function renderHome(){
    const completions=state.history.length;
    const completedStories=new Set(state.history.map(h=>h.id)).size;
    const resume=state.active && state.position==='home' && state.node && state.node!=='END' && state.step>0;
    el.innerHTML=`<section class="hero"><span class="eyebrow">Le laboratoire des possibles</span><h1>Et si… <em>tu choisissais</em> la suite ?</h1><p>Une histoire commence. Tu prends une décision. Le monde change. Rejoue pour découvrir des chemins et des fins différentes. Ici, ton choix compte vraiment.</p><div class="numbers"><div class="number"><strong>3</strong><span>histoires</span></div><div class="number"><strong>9</strong><span>fins à découvrir</span></div><div class="number"><strong>${completions}</strong><span>parcours terminés</span></div></div></section>${resume?`<div class="mini-banner"><div><strong>🎬 Une histoire t’attend</strong><p>Tu peux reprendre exactement à ta dernière décision.</p></div><button class="btn" data-action="resume">Reprendre →</button></div>`:''}<div class="sect-header"><h2>Choisis ton univers</h2><p>Trois histoires courtes à vivre, revivre et transformer.</p></div><div class="stories">${STORIES.map(s=>`<button class="story-card" style="background:${s.gradient}" data-start="${s.id}"><span class="card-top">${escapeHTML(s.genre)}</span><span class="card-emoji">${s.icon}</span><span class="card-title">${escapeHTML(s.title)}</span><span class="card-desc">${escapeHTML(s.desc)}</span><span class="card-foot"><span>⏱ ${s.minutes} · ${s.steps} décisions</span><span>Jouer ↗</span></span></button>`).join('')}</div><div class="notice">💾 Tes parties et tes fins découvertes sont mémorisées sur cet appareil, dans ce navigateur. Aucun compte nécessaire.</div>`;
  }
  function renderScene(s){
    const node=s.nodes[state.node];if(!node){start(s.id);return}
    el.innerHTML=`<div class="screen-top"><button class="back" data-action="home">← Histoires</button><span class="chapter">${escapeHTML(s.title)} · Décision ${state.step+1}/${s.steps}</span></div><div class="progress-track"><div class="progress-bar" style="width:${Math.round(state.step/s.steps*100)}%"></div></div>${statsHTML()}<article class="scene-card"><div class="scene-symbol">${s.icon}</div><p class="scene-kicker">${escapeHTML(node.scene)}</p><h2>${escapeHTML(node.title)}</h2><p class="scene-narration">${escapeHTML(node.text)}</p></article><h3 class="prompt">Et si tu décidais de…</h3><div class="choices">${node.choices.map((choice,i)=>`<button class="choice" data-choice="${i}"><span class="choice-index">${String(i+1).padStart(2,'0')}</span><span class="choice-label">${escapeHTML(choice.label)}</span><span class="arrow">→</span></button>`).join('')}</div><div class="notice">Il n’y a pas de réponse parfaite. L'histoire garde la trace de tes décisions.</div>`;
  }
  function renderImpact(s){
    const p=state.impact;if(!p){state.position='scene';return render()}
    el.innerHTML=`<div class="screen-top"><button class="back" data-action="home">← Histoires</button><span class="chapter">${escapeHTML(s.title)} · Conséquence</span></div><div class="scene-card"><span class="impact-tag">✦ Ton choix a changé l’histoire</span><p class="impact-choice">Tu as choisi : ${escapeHTML(p.choice)}</p><h2 class="impact-title">Et maintenant…</h2><p class="impact-description">${escapeHTML(p.result)}</p><div class="impact-summary">${p.effect.map((n,i)=>n?`<span class="delta ${n>0?'plus':'minus'}">${labels[i]} ${n>0?'+':''}${n}</span>`:'').join('')||'<span class="delta">Les conséquences se dessinent…</span>'}</div><button class="btn wide" data-action="continue">${state.node==='END'?'Découvrir ma fin ✨':'Découvrir la suite →'}</button></div><div style="margin-top:20px">${statsHTML()}</div>`;
  }
  function renderEnding(s){
    const id=s.resolve(state);const e=s.endings.find(e=>e.id===id)||s.endings[0];
    el.innerHTML=`<div class="screen-top"><button class="back" data-action="home">← Histoires</button><span class="chapter">Histoire terminée · ${escapeHTML(s.title)}</span></div><div class="scene-card"><span class="impact-tag">✦ Ton histoire, ta fin</span><div class="outcome-icon">${e.icon}</div><h1 class="outcome-title">${escapeHTML(e.title)}</h1><p class="outcome-text">${escapeHTML(e.text)}</p><p class="outcome-sub">${escapeHTML(e.sub)}</p><h3 style="margin:26px 0 12px">Ton parcours</h3>${statsHTML()}<div class="results-actions"><button class="btn" data-action="restart">↻ Rejouer</button><button class="btn secondary" data-action="home">Autres histoires</button></div></div><section class="journal"><h2>Tes ${state.log.length} décisions</h2>${state.log.map((entry,i)=>`<div class="journal-entry"><strong>${i+1}. ${escapeHTML(entry.choice)}</strong><p>${escapeHTML(entry.result)}</p></div>`).join('')}</section>`;
  }
  function renderHistory(){
    const unique=new Set(state.history.map(h=>h.id+':'+h.ending));
    el.innerHTML=`<div class="screen-top"><button class="back" data-action="back">← Revenir</button><span class="chapter">Carnet d'aventures</span></div><h1 style="font-size:48px">Tes histoires<span style="color:var(--coral)">.</span></h1><p>Retrouve les fins que tu as découvertes. Certaines histoires cachent encore d'autres possibilités…</p><div class="numbers"><div class="number"><strong>${state.history.length}</strong><span>parties terminées</span></div><div class="number"><strong>${unique.size}/9</strong><span>fins découvertes</span></div></div>${state.history.length?state.history.slice().reverse().map(h=>{const s=STORIES.find(s=>s.id===h.id);const e=s?.endings.find(e=>e.id===h.ending);return `<div class="history-card"><strong>${s?.icon||'✨'} ${escapeHTML(s?.title||'Histoire')} : ${e?.icon||''} ${escapeHTML(e?.title||'Fin')}</strong><p class="meta">${escapeHTML(h.date)} · ${h.steps} décisions</p></div>`}).join(''):'<div class="empty">📖<h3>Le carnet est encore vide</h3><p>Termine ta première histoire pour découvrir ta première fin.</p><button class="btn" data-action="home">Choisir une histoire →</button></div>'}<div class="notice"><strong>Confidentialité :</strong> l’historique reste sur ton appareil. Il n’est envoyé à aucun serveur.</div>${state.history.length?'<button class="btn ghost" data-action="clear-history">Effacer le journal des fins</button>':''}`;
  }
  function start(id){const s=STORIES.find(x=>x.id===id);if(!s)return;state={...state,active:id,position:'scene',node:'start',step:0,stats:[5,5,5],log:[],impact:null};save();render();scrollTop()}
  function choose(index){const s=story(),node=s?.nodes[state.node],c=node?.choices[index];if(!c)return;state.stats=state.stats.map((v,i)=>Math.max(0,Math.min(10,v+c.effect[i])));state.log.push({choice:c.label,result:c.result,tag:c.tag,scene:node.title});state.node=c.to;state.step++;state.impact={choice:c.label,result:c.result,effect:c.effect};state.position='impact';save();render();scrollTop()}
  function continueStory(){if(state.node==='END'){finish();return}state.position='scene';state.impact=null;save();render();scrollTop()}
  function finish(){const s=story();if(!s)return;const ending=s.resolve(state);state.history.push({id:s.id,ending,steps:state.log.length,date:new Date().toLocaleDateString('fr-FR')});if(state.history.length>100)state.history=state.history.slice(-100);state.position='ending';state.impact=null;save();render();scrollTop()}
  let beforeHistory='home';
  function goHome(){state.position='home';save();render();scrollTop()}
  function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
  function historyToggle(){if(state.position==='history'){state.position=beforeHistory;save();render();scrollTop()}else{beforeHistory=state.position;state.position='history';save();render();scrollTop()}}
  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.id==='brandButton'){goHome();return}
    if(target.id==='historyButton'){historyToggle();return}
    const id=target.dataset.start;if(id){start(id);return}
    if(target.dataset.choice!==undefined){choose(Number(target.dataset.choice));return}
    const action=target.dataset.action;
    if(action==='home'){goHome()}else if(action==='continue'){continueStory()}else if(action==='restart'){start(state.active)}else if(action==='back'){historyToggle()}else if(action==='resume'){state.position=state.impact?'impact':'scene';save();render();scrollTop()}else if(action==='clear-history'){
      if(window.confirm('Effacer toutes les fins découvertes ? Cette action est irréversible.')){state.history=[];save();render()}
    }
  });
  if(state.position==='impact' && !state.impact)state.position='scene';
  if(state.position==='history')state.position='home';
  render();
  </script>
</body>
</html>
